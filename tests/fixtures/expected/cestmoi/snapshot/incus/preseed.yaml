config: {}
networks:
- name: incusbr0
  type: bridge
  config:
    ipv4.address: 10.143.9.1/24
    ipv4.nat: "true"
storage_pools:
- name: default
  driver: btrfs
  config:
    size: 60GiB
    source: /var/lib/incus/disks/default.img
profiles:
- name: default
  devices:
    eth0:
      name: eth0
      network: incusbr0
      type: nic
    root:
      path: /
      pool: default
      type: disk
