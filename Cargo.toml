[package]
name = "cestmoi"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "moi — one binary that runs a Linux server: state capture, AI context, health checks, Uptime Kuma sync, backups and one-command rebuilds"
license = "MIT"
repository = "https://github.com/prabhask5/moi"
readme = "README.md"
keywords = ["server", "backup", "monitoring", "homelab", "uptime-kuma"]
categories = ["command-line-utilities"]
exclude = ["tests/fixtures/", ".github/"]
default-run = "moi"

# The packages carry what the tarball carries, in the places a distribution expects them. The unit is
# installed but not enabled: `moi init` switches it on once there is a configuration.
[package.metadata.deb]
name = "moi"
maintainer = "moi maintainers <noreply@github.com>"
section = "admin"
priority = "optional"
depends = ""
recommends = "restic"
extended-description = "Captures a server's whole setup into a versioned record, writes an always-current description for AI assistants, runs health checks, keeps Uptime Kuma in sync, backs up what matters and rebuilds the server on new hardware."
maintainer-scripts = "packaging/deb"
assets = [
    ["target/release/moi", "usr/bin/moi", "755"],
    ["packaging/moi.service", "usr/lib/systemd/system/moi.service", "644"],
    ["packaging/completions/moi.bash", "usr/share/bash-completion/completions/moi", "644"],
    ["packaging/completions/_moi", "usr/share/zsh/vendor-completions/_moi", "644"],
    ["packaging/completions/moi.fish", "usr/share/fish/vendor_completions.d/moi.fish", "644"],
    ["packaging/moi.1", "usr/share/man/man1/moi.1", "644"],
    ["README.md", "usr/share/doc/moi/README.md", "644"],
    ["LICENSE", "usr/share/doc/moi/LICENSE", "644"],
]

[package.metadata.generate-rpm]
name = "moi"
pre_uninstall_script = "packaging/rpm-preun.sh"
assets = [
    { source = "target/release/moi", dest = "/usr/bin/moi", mode = "755" },
    { source = "packaging/moi.service", dest = "/usr/lib/systemd/system/moi.service", mode = "644" },
    { source = "packaging/completions/moi.bash", dest = "/usr/share/bash-completion/completions/moi", mode = "644" },
    { source = "packaging/completions/_moi", dest = "/usr/share/zsh/site-functions/_moi", mode = "644" },
    { source = "packaging/completions/moi.fish", dest = "/usr/share/fish/vendor_completions.d/moi.fish", mode = "644" },
    { source = "packaging/moi.1", dest = "/usr/share/man/man1/moi.1", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/moi/README.md", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/licenses/moi/LICENSE", mode = "644" },
]

[package.metadata.generate-rpm.recommends]
restic = "*"

[[bin]]
name = "moi"
path = "src/main.rs"

[lib]
name = "cestmoi"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
clap_complete = "4"
clap_mangen = "0.3"
flate2 = "1"
md-5 = "0.11"
gix = { version = "0.90", default-features = false, features = ["sha1", "revision"] }
rustix = { version = "1", features = ["fs"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rusqlite = { version = "0.43", features = ["bundled", "backup"] }
sha2 = "0.11"
tar = { version = "0.4", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1.2"

[dev-dependencies]

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"
print_stderr = "allow"
large_enum_variant = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
debug = 1
