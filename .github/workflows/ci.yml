name: CI

# Every job here must pass before a pull request can merge. Branch protection requires only the
# `required` job at the bottom, which fails unless all the others succeeded, so jobs can be added
# or removed without changing repository settings (same pattern as prabhask5/stellar).
#
# Integration tests that need real services (Uptime Kuma, Postgres, restic) run in the `integration`
# job with service containers; they are #[ignore] locally unless MOI_IT=1.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"

jobs:
  static:
    name: static
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Tests live in tests/
        run: scripts/check-tests-location.sh
      - name: No secrets committed
        run: scripts/check-secrets.sh
      - name: Repo hygiene (no implementation leftovers)
        run: scripts/check-hygiene.sh
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - name: The declared minimum Rust version builds
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          rustup toolchain install "$msrv" --profile minimal --no-self-update
          RUSTFLAGS="" cargo "+$msrv" check --locked
      - name: Links in the docs
        run: python3 scripts/check-links.py
      - uses: EmbarkStudios/cargo-deny-action@bb119f768ea239e765aeaef5769558d4f21213aa # v2

  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo test --all-features

  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      kuma:
        image: louislam/uptime-kuma:1.23.17
        ports: ["3001:3001"]
      # the 2.x line: other columns, other required fields (SQLite chosen up front, so no setup page for it)
      kuma2:
        image: louislam/uptime-kuma:2
        env:
          UPTIME_KUMA_DB_TYPE: sqlite
        ports: ["3002:3001"]
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: fake-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      # S3-compatible server for `moi context share` (verifies SigV4, so presigned links are really tested).
      # MinIO no longer publishes images; CloudServer starts without arguments, which a service needs.
      s3:
        image: zenko/cloudserver:latest
        env:
          S3BACKEND: mem
          REMOTE_MANAGEMENT_DISABLE: "1"
          SCALITY_ACCESS_KEY_ID: fakeaccesskey
          SCALITY_SECRET_ACCESS_KEY: fakesecretkey123
        ports: ["8000:8000"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install restic
        run: sudo apt-get update -q && sudo apt-get install -y -q restic
      - name: Integration tests (ignored tests, real services)
        env:
          MOI_IT: "1"
          MOI_IT_KUMA_URL: http://localhost:3001
          MOI_IT_KUMA2_URL: http://localhost:3002
          MOI_IT_PG_URL: postgres://postgres:fake-password@localhost:5432/postgres
          MOI_IT_S3_ENDPOINT: http://localhost:8000
          MOI_IT_S3_ACCESS_KEY: fakeaccesskey
          MOI_IT_S3_SECRET_KEY: fakesecretkey123
        run: cargo test --all-features -- --ignored

  build:
    name: build (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.target }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
      - uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2
        with:
          tool: cargo-zigbuild
      - run: cargo zigbuild --release --target ${{ matrix.target }}
      - name: Static binary check
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          file target/${{ matrix.target }}/release/moi
          target/${{ matrix.target }}/release/moi --version

  budgets:
    name: budgets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: scripts/budgets.sh

  required:
    name: required
    if: always()
    needs: [static, unit, integration, build, budgets]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null
