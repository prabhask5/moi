name: nightly

# The end-to-end test of docs/spec/09-restore-verify.md: a server is built in a VM, backed up, rebuilt
# on a second VM with `moi restore`, rebooted and verified. Too slow for every PR; it also runs on PRs
# that touch the restore or the test itself.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "tests/e2e/**"
      - ".github/workflows/nightly.yml"
      - "src/restore.rs"
      - "src/restore/**"

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: restore end to end (VMs)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: x86_64-unknown-linux-musl
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
      - uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2
        with:
          tool: cargo-zigbuild
      - run: cargo zigbuild --release --target x86_64-unknown-linux-musl
      - name: Let the runner use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Back up, rebuild, reboot, verify
        run: tests/e2e/run.sh target/x86_64-unknown-linux-musl/release/moi
