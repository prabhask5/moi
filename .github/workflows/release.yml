name: Release

# Tag vX.Y.Z on main -> static binaries, .deb/.rpm, checksums, attestations, GitHub Release,
# crates.io (package `cestmoi`), Homebrew tap. Spec: docs/spec/12-distribution.md.
#
# Run by hand (workflow_dispatch) or by a pull request that touches packaging, it is a dry run:
# everything is built, packaged, installed in clean containers and checked — nothing is published.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "packaging/**"
      - "install.sh"
      - "tests/e2e/install-test.sh"
      - "tests/e2e/package-test.sh"
      - "Cargo.toml"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  hygiene:
    name: release hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: The tag is the version in Cargo.toml
        if: github.ref_type == 'tag'
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, Cargo.toml $v" >&2; exit 1; }
      - name: No scaffolding, TODOs or reference material in a release
        if: github.ref_type == 'tag'
        run: scripts/check-hygiene.sh --release

  build:
    needs: hygiene
    name: build (${{ matrix.target }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: release-${{ matrix.target }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
      - uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2
        with:
          tool: cargo-zigbuild,cargo-deb,cargo-generate-rpm
      - name: Build
        env:
          MOI_GIT_SHA: ${{ github.sha }}
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}
      - name: Package tarball
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          d=moi-$v-${{ matrix.target }}
          mkdir -p dist/$d
          cp target/${{ matrix.target }}/release/moi README.md LICENSE packaging/moi.1 packaging/moi.service dist/$d/
          cp -r packaging/completions dist/$d/
          tar -C dist -czf dist/$d.tar.gz $d
          rm -rf dist/$d
      - name: Package .deb and .rpm
        run: |
          cargo deb --no-build --no-strip --target ${{ matrix.target }} --output dist/
          cargo generate-rpm --target ${{ matrix.target }} --output dist/
          ls -l dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        if: github.ref_type == 'tag'
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist-${{ matrix.target }}
          path: dist/*

  verify:
    needs: build
    name: install what was built
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # first, while the checkout is clean: cargo refuses to package a tree with stray files
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - name: The crate packages for crates.io
        run: cargo package --locked --no-verify && cargo package --locked --list | grep -c .
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: The installer installs a release and refuses a tampered one
        run: |
          mkdir bin && tar -xzf dist/moi-*-x86_64-unknown-linux-musl.tar.gz -C bin --strip-components 1
          bin/moi --version
          tests/e2e/install-test.sh bin/moi
      - name: The installer against these very artifacts
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          MOI_RELEASE_URL="file://$PWD/dist" sh install.sh --version "$v" --prefix "$PWD/prefix"
          prefix/bin/moi --version
      - name: The packages install on Ubuntu, Debian and Fedora
        run: tests/e2e/package-test.sh dist
      - name: The Homebrew formula is valid Ruby
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          packaging/homebrew-formula.sh "$v" dist/SHA256SUMS > moi.rb
          ruby -c moi.rb

  release:
    if: github.ref_type == 'tag'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - name: Release notes from CHANGELOG
        run: |
          v=${GITHUB_REF_NAME#v}
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: checksums
          path: dist/SHA256SUMS

  crates-io:
    if: github.ref_type == 'tag'
    needs: release
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - name: Publish (skipped until the CARGO_REGISTRY_TOKEN secret exists)
        if: env.CARGO_REGISTRY_TOKEN != ''
        run: cargo publish --locked

  homebrew:
    if: github.ref_type == 'tag'
    needs: release
    runs-on: ubuntu-latest
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: checksums
      - name: Update the formula in prabhask5/homebrew-tap (skipped until the HOMEBREW_TAP_TOKEN secret exists)
        if: env.HOMEBREW_TAP_TOKEN != ''
        run: |
          v=${GITHUB_REF_NAME#v}
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/prabhask5/homebrew-tap.git" tap
          mkdir -p tap/Formula
          packaging/homebrew-formula.sh "$v" SHA256SUMS > tap/Formula/moi.rb
          cd tap
          git add Formula/moi.rb
          git -c user.name="moi release" -c user.email="noreply@github.com" commit -m "moi $v"
          git push
